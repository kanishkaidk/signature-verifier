# fly.toml app configuration file generated for signature-verifier-frontend on 2025-11-08T22:35:24+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'signature-verifier-frontend'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    VITE_API_URL = 'https://signature-verifier-backend.fly.dev'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
